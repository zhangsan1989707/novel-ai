services:
  db:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg15}
    container_name: novelai-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-novelai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-novel_ai}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init/001-enable-pgvector.sql:/docker-entrypoint-initdb.d/001-enable-pgvector.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novelai -d novel_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    # 使用预构建的镜像（快速部署），或者使用 build 本地构建
    # image: novel-ai-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3200:3200"
    env_file: .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-novelai}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-novel_ai}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
